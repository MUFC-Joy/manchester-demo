<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>MANCHESTER · 方块城市演示</title>
  <link rel="stylesheet" href="./src/ui/style.css" />
</head>
<body>
  <canvas id="app"></canvas>

  <div id="hud">
    <header id="hud-top">
      <h1 id="title">MANCHESTER</h1>
      <p id="subtitle">加载中…</p>
    </header>

    <footer id="hud-bottom">
      <div id="controls">
        <button id="btn-tour" class="btn btn-primary">▶ 一键 Tour</button>
        <button id="btn-daynight" class="btn">🌙 夜景</button>
        <button id="btn-free" class="btn">⟲ 自由视角</button>
        <button id="btn-labels" class="btn">📍 地名</button>
      </div>
      <div id="legend-wrap">
        <button id="btn-legend" class="btn btn-mini">图例 ▾</button>
        <div id="legend-panel" class="is-hidden">
          <span class="lg"><i class="sw sw-building"></i>建筑</span>
          <span class="lg"><i class="sw sw-road"></i>主干道（白虚线）</span>
          <span class="lg"><i class="sw sw-rail"></i>铁路 / 电车</span>
          <span class="lg"><i class="sw sw-water"></i>运河 / 河流</span>
          <span class="lg"><i class="sw sw-green"></i>公园绿地</span>
          <span class="lg lg-ot"><i></i>老特拉福德座椅</span>
          <span class="lg lg-et"><i></i>伊蒂哈德座椅</span>
        </div>
      </div>
      <div id="stats"></div>
    </footer>

    <div id="tour-ctrl" class="is-hidden">
      <button id="btn-chapter-prev" class="btn btn-mini">⏮ 上一章</button>
      <button id="btn-speed" class="btn btn-mini">1×</button>
      <button id="btn-chapter-next" class="btn btn-mini">下一章 ⏭</button>
    </div>
    <div id="tour-bar" class="is-hidden"><div id="tour-fill"></div></div>

    <div id="hint">左键拖动 平移 · 右键拖动 旋转 · 滚轮 缩放 · 双击地面 飞到该处</div>

    <div id="chapter"></div>
  </div>

  <div id="loading">
    <div class="spin"></div>
    <p id="loading-text">正在构建城市…</p>
  </div>

  <script type="module" src="./src/main.js"></script>
</body>
</html>
